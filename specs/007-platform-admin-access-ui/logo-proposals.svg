<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Conceptos de identidad para SmartBooking</title>
  <desc id="description">Tres propuestas de símbolo y wordmark en fondos claros y oscuros. Son conceptos pendientes de selección.</desc>
