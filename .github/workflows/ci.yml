name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Se cachea por ambos archivos: requirements-dev.txt incluye requirements.txt.
          cache: pip
          cache-dependency-path: |
            backend/api-backend/requirements.txt
            backend/api-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # La suite no necesita PostgreSQL: los tests que tocan BD sustituyen
      # AsyncSessionLocal por dobles. Verificado en limpio (sin .env): 423 passed.
      - name: Run tests
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend · vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
